
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sam's Comics | Photos</title>
    <link rel="stylesheet" href="./global.css" type="text/css">

    <header class="header" id="site-header">

            <a href="./index.html" class="nav-link">Home</a>

    <main class="main" id="main">
        <section class="photo-grid" id="photo-gallery" aria-label="Comic photo gallery">

            <figure class="photo-item">
                <img src="./images/comic-1.jpg" alt="First Sam's Comics artwork" class="photo-image">
                <figcaption class="photo-caption">Early Beginnings</figcaption>
            </figure>

            <figure class="photo-item">
                <img src="./images/comic-2.jpg" alt="Second Sam's Comics artwork" class="photo-image">
                <figcaption class="photo-caption">Original Characters</figcaption>
            </figure>

            <figure class="photo-item">
                <img src="./images/IMG_5395.jpeg" alt="Third Sam's Comics artwork" class="photo-image">
                <figcaption class="photo-caption">Character Designs</figcaption>
            </figure>

            <figure class="photo-item">
                <img src="./images/IMG_5406.jpeg" alt="Fourth Sam's Comics artwork" class="photo-image">
                <figcaption class="photo-caption">Comic Panels</figcaption>
            </figure>

            <figure class="photo-item">
                <img src="./images/IMG_5402 (1).jpeg" alt="Fifth Sam's Comics artwork" class="photo-image">

            <figure class="photo-item">
                <img src="./images/comic-6.jpg" alt="Sixth Sam's Comics artwork" class="photo-image">

            </figure>

            <figure class="photo-item">
                <img src="./images/IMG_5399.jpeg" alt="Seventh Sam's Comics artwork" class="photo-image">

            </figure>

            <figure class="photo-item">
                <img src="./images/IMG_5398.jpeg" alt="Eighth Sam's Comics artwork" class="photo-image">
                <figcaption class="photo-caption">New Ideas</figcaption>
            </figure>

            <figure class="photo-item">
                <img src="./images/comic-9.jpg" alt="Ninth Sam's Comics artwork" class="photo-image">
                <figcaption class="photo-caption">The SCMU</figcaption>
            </figure>

        </section>

        <section class="photo-description" id="photo-description">
            <p>
                Every drawing represents a piece of the history of Sam's Comics.
                From the earliest sketches to the growing Sam's Comics Universe
                (SCMU), these are the ideas and characters behind the comics.
            </p>
        </section>
    </main>
